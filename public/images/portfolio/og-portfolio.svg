<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929"/>
      <stop offset="50%" style="stop-color:#0a2540"/>
      <stop offset="100%" style="stop-color:#1a3552"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a860"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#c9a860"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#c9a860" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="1400" y2="630" stroke="#c9a860" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="1600" y2="630" stroke="#c9a860" stroke-width="0.5"/>
    <line x1="-200" y1="0" x2="1000" y2="630" stroke="#c9a860" stroke-width="0.5"/>
    <line x1="-400" y1="0" x2="800" y2="630" stroke="#c9a860" stroke-width="0.5"/>
  </g>

  <!-- Decorative circle -->
  <circle cx="1050" cy="100" r="180" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.15"/>
  <circle cx="150" cy="530" r="120" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.1"/>

  <!-- Title Area -->
  <text x="100" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="white">Portfolio</text>
  <text x="100" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="white" opacity="0.7">作品集 — 精選互動遊戲、教育網站與客製化專案</text>

  <!-- Gold accent line -->
  <rect x="100" y="190" width="120" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- Card 1 - Educational -->
  <g filter="url(#shadow)">
    <rect x="100" y="240" width="300" height="200" rx="12" fill="#1e2d3d"/>
    <rect x="100" y="240" width="300" height="70" rx="12" fill="url(#card1)"/>
    <rect x="100" y="298" width="300" height="12" fill="#1e2d3d"/>
    <text x="160" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="white">🎓</text>
    <text x="200" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="white">教育 / 益智</text>
    <text x="120" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8">兒童遊樂園</text>
    <text x="120" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8">樂齡益智區</text>
    <rect x="120" y="400" width="55" height="20" rx="10" fill="#6c5ce7" opacity="0.3"/>
    <text x="128" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a29bfe">React</text>
    <rect x="182" y="400" width="45" height="20" rx="10" fill="#6c5ce7" opacity="0.3"/>
    <text x="190" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a29bfe">Vue</text>
  </g>

  <!-- Card 2 - Games -->
  <g filter="url(#shadow)">
    <rect x="440" y="240" width="300" height="200" rx="12" fill="#1e2d3d"/>
    <rect x="440" y="240" width="300" height="70" rx="12" fill="url(#card2)"/>
    <rect x="440" y="298" width="300" height="12" fill="#1e2d3d"/>
    <text x="500" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="white">🎮</text>
    <text x="540" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="white">遊戲作品</text>
    <text x="460" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8">媽祖開壇抽獎</text>
    <text x="460" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8">坦克大戰</text>
    <rect x="460" y="400" width="55" height="20" rx="10" fill="#f5576c" opacity="0.3"/>
    <text x="468" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#f093fb">React</text>
    <rect x="522" y="400" width="65" height="20" rx="10" fill="#f5576c" opacity="0.3"/>
    <text x="530" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#f093fb">Canvas</text>
  </g>

  <!-- Card 3 - Custom Websites -->
  <g filter="url(#shadow)">
    <rect x="780" y="240" width="300" height="200" rx="12" fill="#1e2d3d"/>
    <rect x="780" y="240" width="300" height="70" rx="12" fill="url(#card3)"/>
    <rect x="780" y="298" width="300" height="12" fill="#1e2d3d"/>
    <text x="840" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="white">🌐</text>
    <text x="880" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="white">客製化官網</text>
    <text x="800" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8">個人形象官網</text>
    <text x="800" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8">商務形象官網</text>
    <rect x="800" y="400" width="55" height="20" rx="10" fill="#00f2fe" opacity="0.3"/>
    <text x="808" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4facfe">Vue 3</text>
    <rect x="862" y="400" width="65" height="20" rx="10" fill="#00f2fe" opacity="0.3"/>
    <text x="870" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4facfe">Quasar</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="500" width="1200" height="130" fill="#071520"/>

  <!-- Author info -->
  <text x="100" y="555" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="white">Poyu Chen 陳柏妤</text>
  <text x="100" y="585" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="white" opacity="0.6">資深全端架構師 / 技術團隊領導者</text>

  <!-- URL -->
  <text x="1100" y="570" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="url(#gold)" text-anchor="end">chenpoyu.github.io</text>

  <!-- Gold border top of footer -->
  <rect x="0" y="498" width="1200" height="2" fill="url(#gold)" opacity="0.4"/>
</svg>

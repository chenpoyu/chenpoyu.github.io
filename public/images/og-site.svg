<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929"/>
      <stop offset="50%" style="stop-color:#0a2540"/>
      <stop offset="100%" style="stop-color:#1a3552"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a860"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#c9a860"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle diagonal lines -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#c9a860" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="1400" y2="630" stroke="#c9a860" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="1600" y2="630" stroke="#c9a860" stroke-width="0.5"/>
    <line x1="-200" y1="0" x2="1000" y2="630" stroke="#c9a860" stroke-width="0.5"/>
    <line x1="-400" y1="0" x2="800" y2="630" stroke="#c9a860" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="1800" y2="630" stroke="#c9a860" stroke-width="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="200" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.1"/>
  <circle cx="1050" cy="120" r="140" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.07"/>
  <circle cx="150" cy="550" r="100" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.08"/>

  <!-- Left content area -->
  <!-- Name -->
  <text x="100" y="180" font-family="'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif" font-size="60" font-weight="700" fill="white">Poyu Chen</text>
  <text x="100" y="230" font-family="'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif" font-size="32" fill="white" opacity="0.85">陳柏妤</text>

  <!-- Gold accent line -->
  <rect x="100" y="252" width="160" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- Role -->
  <text x="100" y="300" font-family="'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif" font-size="24" font-weight="600" fill="url(#gold)">資深全端架構師 / 技術團隊領導者</text>

  <!-- Description -->
  <text x="100" y="350" font-family="'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif" font-size="18" fill="white" opacity="0.7">13+ 年開發經驗 • 車聯網/物聯網專家 • 電商平台與 SSO 架構師</text>

  <!-- Tech tags -->
  <g>
    <!-- Tag: Java -->
    <rect x="100" y="385" width="65" height="28" rx="14" fill="white" opacity="0.1"/>
    <text x="132" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">Java</text>
    <!-- Tag: Vue.js -->
    <rect x="175" y="385" width="70" height="28" rx="14" fill="white" opacity="0.1"/>
    <text x="210" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">Vue.js</text>
    <!-- Tag: React -->
    <rect x="255" y="385" width="68" height="28" rx="14" fill="white" opacity="0.1"/>
    <text x="289" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">React</text>
    <!-- Tag: .NET -->
    <rect x="333" y="385" width="60" height="28" rx="14" fill="white" opacity="0.1"/>
    <text x="363" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">.NET</text>
    <!-- Tag: AWS -->
    <rect x="403" y="385" width="58" height="28" rx="14" fill="white" opacity="0.1"/>
    <text x="432" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">AWS</text>
    <!-- Tag: Azure -->
    <rect x="471" y="385" width="65" height="28" rx="14" fill="white" opacity="0.1"/>
    <text x="503" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">Azure</text>
  </g>

  <!-- Right side: Feature cards -->
  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="720" y="170" width="200" height="90" rx="10" fill="#1e2d3d"/>
    <rect x="720" y="170" width="200" height="35" rx="10" fill="url(#accent1)"/>
    <rect x="720" y="197" width="200" height="8" fill="#1e2d3d"/>
    <text x="740" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="white">🏗️ 架構設計</text>
    <text x="740" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" opacity="0.7">微服務 • IoT • SSO • 高併發</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="950" y="170" width="200" height="90" rx="10" fill="#1e2d3d"/>
    <rect x="950" y="170" width="200" height="35" rx="10" fill="url(#accent2)"/>
    <rect x="950" y="197" width="200" height="8" fill="#1e2d3d"/>
    <text x="970" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="white">💼 技術諮詢</text>
    <text x="970" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" opacity="0.7">100+ 專案 • 40+ 團隊</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="720" y="290" width="200" height="90" rx="10" fill="#1e2d3d"/>
    <rect x="720" y="290" width="200" height="35" rx="10" fill="#f093fb" opacity="0.8"/>
    <rect x="720" y="317" width="200" height="8" fill="#1e2d3d"/>
    <text x="740" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="white">🎮 作品集</text>
    <text x="740" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" opacity="0.7">互動遊戲 • 教育網站 • 官網</text>
  </g>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="950" y="290" width="200" height="90" rx="10" fill="#1e2d3d"/>
    <rect x="950" y="290" width="200" height="35" rx="10" fill="#00b894" opacity="0.8"/>
    <rect x="950" y="317" width="200" height="8" fill="#1e2d3d"/>
    <text x="970" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="white">👥 團隊領導</text>
    <text x="970" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" opacity="0.7">技術培訓 • 專案管理</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="500" width="1200" height="130" fill="#071520"/>
  <rect x="0" y="498" width="1200" height="2" fill="url(#gold)" opacity="0.3"/>

  <!-- Stats -->
  <text x="150" y="555" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="url(#gold)" text-anchor="middle">13+</text>
  <text x="150" y="580" font-family="'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif" font-size="12" fill="white" opacity="0.6" text-anchor="middle">年開發經驗</text>

  <text x="350" y="555" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="url(#gold)" text-anchor="middle">100+</text>
  <text x="350" y="580" font-family="'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif" font-size="12" fill="white" opacity="0.6" text-anchor="middle">專案經驗</text>

  <text x="550" y="555" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="url(#gold)" text-anchor="middle">40+</text>
  <text x="550" y="580" font-family="'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif" font-size="12" fill="white" opacity="0.6" text-anchor="middle">團隊規模</text>

  <text x="750" y="555" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="url(#gold)" text-anchor="middle">20+</text>
  <text x="750" y="580" font-family="'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif" font-size="12" fill="white" opacity="0.6" text-anchor="middle">技術領域</text>

  <!-- URL -->
  <text x="1100" y="570" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="url(#gold)" text-anchor="end">chenpoyu.github.io</text>
</svg>
